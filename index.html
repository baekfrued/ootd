<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ootd223" />
  <title>ootd223</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background-color: #f5f6fa;
      color: #1e293b;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); }
    .nav-safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen select-none">

  <!-- 顶部导航栏 (微信小程序风格) -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-full bg-slate-900 text-white flex items-center justify-center shadow-sm">
        <i class="fa-solid fa-shirt text-sm"></i>
      </div>
      <h1 class="text-lg font-bold tracking-tight text-slate-900">ootd223</h1>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openBackupModal()" class="px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-600 text-xs font-medium flex items-center gap-1 active:scale-95 transition">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>备份/恢复</span>
      </button>
      <!-- 模拟小程序胶囊按钮 -->
      <div class="flex items-center border border-slate-200 rounded-full px-2.5 py-1 bg-white/80 gap-2.5 text-slate-700">
        <button onclick="openCategoryModal()" title="管理分类" class="text-xs active:opacity-60">
          <i class="fa-solid fa-tags"></i>
        </button>
        <span class="w-px h-3.5 bg-slate-200"></span>
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" title="回到顶部" class="text-xs active:opacity-60">
          <i class="fa-regular fa-circle-dot"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="max-w-md mx-auto px-3.5 pt-3.5 safe-bottom">

    <!-- 页面 1：穿搭筛选 -->
    <section id="tab-match" class="space-y-3.5 animate-fade">

      <!-- 第一步：选择天气温度 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded-full bg-amber-100 text-amber-700 text-xs font-bold flex items-center justify-center">1</span>
            <h2 class="text-sm font-bold text-slate-800">第一步：选择今日天气温度</h2>
          </div>
          <span id="current-temp-label" class="text-xs font-medium text-indigo-600">🌈 全部温度</span>
        </div>
        <div id="temp-filter-list" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5"></div>
      </div>

      <!-- 第二步：选择想穿的单品 -->
      <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold flex items-center justify-center">2</span>
            <h2 class="text-sm font-bold text-slate-800">第二步：选择想穿的单品</h2>
          </div>
          <button onclick="openCategoryModal()" class="text-xs font-medium text-indigo-600 flex items-center gap-1 active:opacity-70">
            <i class="fa-solid fa-sliders text-[11px]"></i>
            <span>自定义分类</span>
          </button>
        </div>

        <!-- 模糊搜索框 -->
        <div class="relative mb-3">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            id="match-search-input"
            type="text"
            placeholder="搜索单品名称..."
            oninput="handleMatchSearch(this.value)"
            class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200/80 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white transition"
          />
          <button
            id="match-search-clear"
            onclick="handleMatchSearch('')"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-slate-200 text-slate-600 text-[10px] items-center justify-center"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- 分类横向切换 -->
        <div id="match-category-tabs" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-2.5 border-b border-slate-100"></div>

        <!-- 已选单品提示栏 -->
        <div id="selected-items-bar" class="hidden mt-2.5 p-2 bg-indigo-50/70 rounded-xl border border-indigo-100/80">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[11px] font-medium text-indigo-700">已选单品：</span>
            <button onclick="clearSelectedItems()" class="text-[11px] text-indigo-600 font-medium hover:underline">清空重选</button>
          </div>
          <div id="selected-items-chips" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- 单品选择列表 -->
        <div id="match-items-container" class="mt-3 flex flex-wrap gap-2 max-h-56 overflow-y-auto pt-0.5"></div>
      </div>

      <!-- 匹配穿搭结果 -->
      <div>
        <div class="flex items-center justify-between px-1 mb-2.5">
          <div class="flex items-center gap-2">
            <h3 class="text-base font-bold text-slate-900">匹配穿搭结果</h3>
            <span id="result-count-badge" class="px-2.5 py-0.5 rounded-full bg-indigo-600 text-white text-xs font-bold">0 套</span>
          </div>
          <span id="result-filter-hint" class="text-xs text-slate-400">当前展示全部穿搭</span>
        </div>

        <!-- 结果网格 -->
        <div id="outfits-grid" class="grid grid-cols-2 gap-3"></div>
      </div>
    </section>

    <!-- 页面 2：我的衣橱管理 -->
    <section id="tab-closet" class="hidden space-y-3.5 animate-fade">
      <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-slate-900">我的单品衣橱</h2>
          <div class="flex gap-2">
            <button onclick="openCategoryModal()" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-medium flex items-center gap-1 active:scale-95 transition">
              <i class="fa-solid fa-folder-plus text-indigo-600"></i>
              <span>管理分类</span>
            </button>
            <button onclick="openItemModal()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-medium flex items-center gap-1 active:scale-95 transition shadow-sm">
              <i class="fa-solid fa-plus"></i>
              <span>新建单品</span>
            </button>
          </div>
        </div>

        <!-- 衣橱搜索 -->
        <div class="relative mb-3">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            id="closet-search-input"
            type="text"
            placeholder="搜索衣橱里的单品..."
            oninput="handleClosetSearch(this.value)"
            class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200/80 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white transition"
          />
        </div>

        <!-- 衣橱分类切换 -->
        <div id="closet-category-tabs" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-2 border-b border-slate-100"></div>

        <!-- 衣橱单品列表 -->
        <div id="closet-items-list" class="mt-3 space-y-2"></div>
      </div>
    </section>

  </main>

  <!-- 底部导航栏 -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200/80 nav-safe-bottom">
    <div class="max-w-md mx-auto grid grid-cols-3 items-center h-16 px-4 relative">
      <button onclick="switchTab('match')" id="nav-match" class="flex flex-col items-center justify-center gap-1 text-indigo-600">
        <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
        <span class="text-[11px] font-bold">穿搭筛选</span>
      </button>

      <div class="flex flex-col items-center justify-center">
        <button
          onclick="openOutfitModal()"
          class="-mt-6 w-12 h-12 rounded-2xl bg-slate-900 text-white shadow-lg shadow-slate-900/25 flex items-center justify-center active:scale-95 transition"
        >
          <i class="fa-solid fa-plus text-lg"></i>
        </button>
        <span onclick="openOutfitModal()" class="text-[11px] font-bold text-slate-800 mt-1 cursor-pointer">＋上传穿搭</span>
      </div>

      <button onclick="switchTab('closet')" id="nav-closet" class="flex flex-col items-center justify-center gap-1 text-slate-400">
        <i class="fa-solid fa-boxes-stacked text-lg"></i>
        <span class="text-[11px] font-medium">我的衣橱</span>
      </button>
    </div>
  </nav>

  <!-- 弹窗 1：上传 / 编辑穿搭 -->
  <div id="outfit-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[92vh] flex flex-col overflow-hidden animate-fade">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between">
        <h3 id="outfit-modal-title" class="text-base font-bold text-slate-900">上传新穿搭</h3>
        <button onclick="closeOutfitModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <!-- 照片上传 -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-2">1. 穿搭照片</label>
          <input type="file" id="outfit-file-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
          <div
            onclick="document.getElementById('outfit-file-input').click()"
            class="relative w-full h-60 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 flex flex-col items-center justify-center overflow-hidden cursor-pointer hover:border-indigo-400 transition"
          >
            <img id="outfit-preview-img" src="" class="hidden w-full h-full object-cover" />
            <div id="outfit-upload-placeholder" class="flex flex-col items-center text-slate-400">
              <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mb-2">
                <i class="fa-solid fa-camera text-xl"></i>
              </div>
              <span class="text-xs font-medium text-slate-600">点击拍照或从手机相册选择</span>
              <span class="text-[11px] text-slate-400 mt-0.5">支持自动高清压缩存储</span>
            </div>
            <button
              type="button"
              id="outfit-reupload-btn"
              class="hidden absolute bottom-2.5 right-2.5 px-3 py-1.5 rounded-full bg-slate-900/75 text-white text-xs backdrop-blur-xs"
            >
              更换照片
            </button>
          </div>
        </div>

        <!-- 适用温度（支持多选） -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-2">2. 适合温度（可多选）</label>
          <div id="modal-temp-options" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- 关联单品 + 快速新建单品 -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-bold text-slate-700">3. 包含哪些衣服单品（可多选）</label>
            <button
              type="button"
              onclick="toggleQuickAddItem()"
              class="text-xs font-bold text-indigo-600 flex items-center gap-1"
            >
              <i class="fa-solid fa-plus-circle"></i>
              <span>新建衣服单品</span>
            </button>
          </div>

          <!-- 弹窗内快速新建单品面板 -->
          <div id="quick-add-item-box" class="hidden mb-3 p-3 rounded-xl bg-indigo-50/70 border border-indigo-100 space-y-2.5">
            <div class="text-xs font-bold text-indigo-900">快速添加新单品到衣橱</div>
            <div class="flex gap-2">
              <select id="quick-item-cat" class="px-2.5 py-2 rounded-lg bg-white border border-slate-200 text-xs text-slate-700 focus:outline-none"></select>
              <input
                type="text"
                id="quick-item-name"
                placeholder="输入单品名称，如：棕色连帽开衫"
                class="flex-1 px-3 py-2 rounded-lg bg-white border border-slate-200 text-xs focus:outline-none focus:border-indigo-500"
              />
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="toggleQuickAddItem()" class="px-3 py-1.5 rounded-lg text-xs text-slate-500">取消</button>
              <button type="button" onclick="saveQuickAddItem()" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-medium">添加并勾选</button>
            </div>
          </div>

          <!-- 弹窗内单品搜索 -->
          <div class="relative mb-2">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input
              type="text"
              id="modal-item-search"
              placeholder="搜索要勾选的单品..."
              oninput="renderModalItemSelector()"
              class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
            />
          </div>

          <div id="modal-items-selector" class="max-h-48 overflow-y-auto space-y-2.5 p-1"></div>
        </div>

        <!-- 备注（选填） -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">4. 穿搭名称 / 备注（选填）</label>
          <input
            type="text"
            id="outfit-note-input"
            placeholder="例如：日常通勤、显瘦穿搭（可不填）"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
          />
        </div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-white flex items-center gap-2.5">
        <button
          type="button"
          id="delete-outfit-btn"
          onclick="handleDeleteOutfit()"
          class="hidden px-4 py-3 rounded-xl bg-rose-50 text-rose-600 text-xs font-bold active:scale-95 transition"
        >
          <i class="fa-solid fa-trash-can mr-1"></i>删除
        </button>
        <button
          type="button"
          onclick="handleSaveOutfit()"
          class="flex-1 py-3 rounded-xl bg-slate-900 text-white text-sm font-bold shadow-md active:scale-98 transition"
        >
          保存穿搭
        </button>
      </div>
    </div>
  </div>

  <!-- 弹窗 2：自定义分类管理 -->
  <div id="category-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col overflow-hidden animate-fade">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-900">自定义衣服分类</h3>
        <button onclick="closeCategoryModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <div class="flex gap-2">
          <input
            type="text"
            id="new-category-input"
            placeholder="输入新分类名称，如：连衣裙、配饰、围巾..."
            class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
          />
          <button
            onclick="handleAddCategory()"
            class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shrink-0 active:scale-95 transition"
          >
            ＋添加
          </button>
        </div>
        <div id="category-manage-list" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <!-- 弹窗 3：新建 / 编辑单品 -->
  <div id="item-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden animate-fade shadow-xl">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between">
        <h3 id="item-modal-title" class="text-base font-bold text-slate-900">新建衣服单品</h3>
        <button onclick="closeItemModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">所属分类</label>
          <select id="item-modal-cat" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">单品名称</label>
          <input
            type="text"
            id="item-modal-name"
            placeholder="例如：阿迪黑色外套、UR黑色弯刀裤"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
          />
        </div>
        <button
          onclick="handleSaveItemModal()"
          class="w-full py-3 rounded-xl bg-slate-900 text-white text-xs font-bold active:scale-98 transition"
        >
          保存单品
        </button>
      </div>
    </div>
  </div>

  <!-- 弹窗 4：数据备份与恢复 -->
  <div id="backup-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden animate-fade shadow-xl">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-900">数据备份与恢复</h3>
        <button onclick="closeBackupModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 space-y-3">
        <p class="text-xs text-slate-500 leading-relaxed">
          你的穿搭照片和单品数据保存在当前手机浏览器本地。如需更换手机或防丢失，可导出备份文件，随时导入恢复。
        </p>
        <button
          onclick="exportBackupData()"
          class="w-full py-3 rounded-xl bg-indigo-600 text-white text-xs font-bold flex items-center justify-center gap-2 active:scale-98 transition"
        >
          <i class="fa-solid fa-download"></i>
          <span>导出全部穿搭备份 (.json)</span>
        </button>
        <label class="w-full py-3 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold flex items-center justify-center gap-2 cursor-pointer active:scale-98 transition">
          <i class="fa-solid fa-upload"></i>
          <span>从备份文件恢复数据</span>
          <input type="file" accept=".json" class="hidden" onchange="importBackupData(event)" />
        </label>
      </div>
    </div>
  </div>

  <!-- 轻提示 Toast -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full bg-slate-900/90 text-white text-xs font-medium shadow-lg backdrop-blur-xs"></div>

  <script>
    // ==================== 常量与默认分类 ====================
    const TEMP_OPTIONS = [
      { id: 'all', label: '全部温度', icon: '🌈' },
      { id: '>25°C (炎热)', label: '>25°C (炎热)', icon: '☀️' },
      { id: '20-25°C (温暖)', label: '20-25°C (温暖)', icon: '🌤️' },
      { id: '15-20°C (微凉)', label: '15-20°C (微凉)', icon: '☁️' },
      { id: '10-15°C (凉爽)', label: '10-15°C (凉爽)', icon: '🧥' },
      { id: '5-10°C (寒冷)', label: '5-10°C (寒冷)', icon: '🧣' },
      { id: '<5°C (严寒)', label: '<5°C (严寒)', icon: '❄️' }
    ];

    const DEFAULT_CATEGORIES = [
      { id: 'cat_outer', name: '外套' },
      { id: 'cat_cardigan', name: '开衫' },
      { id: 'cat_sweater', name: '毛衣' },
      { id: 'cat_inner', name: '内搭' },
      { id: 'cat_pants', name: '裤子' },
      { id: 'cat_shoes', name: '鞋子' },
      { id: 'cat_bag', name: '包' }
    ];

    // 旧版内置演示单品名称名单（用于自动清理残留演示数据，不影响用户自建单品）
    const DEMO_ITEM_NAMES = new Set([
      'Gap外套', '蓝色喇叭裤', '白色内搭T恤', '黑色直筒牛仔裤',
      '灰色阔腿卫裤', '卡其色风衣', '卡其色长风衣', '温柔米色开衫',
      '复古麻花毛衣', '百搭德训鞋', '黑色腋下包', '条纹打底衫',
      '软糯马海毛开衫', '高领打底毛衣', '厚底乐福鞋', '帆布托特包'
    ]);

    // ==================== 状态管理 ====================
    let state = {
      categories: [],
      items: [],
      outfits: [],
      selectedTemp: 'all',
      selectedCategory: 'all',
      selectedItemIds: [],
      matchSearchQuery: '',
      closetCategory: 'all',
      closetSearchQuery: ''
    };

    let editingOutfitId = null;
    let modalTempSelection = [];
    let modalItemSelection = [];
    let modalImageBase64 = '';
    let editingItemId = null;

    // ==================== IndexedDB 本地数据库封装 ====================
    const DB_NAME = 'OOTD_Closet_DB_V2';
    const DB_VERSION = 1;
    let dbInstance = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        if (dbInstance) return resolve(dbInstance);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('kv')) {
            db.createObjectStore('kv');
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGet(key) {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('kv', 'readonly');
          const req = tx.objectStore('kv').get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      }
    }

    async function dbSet(key, val) {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(val, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch {
        localStorage.setItem(key, JSON.stringify(val));
      }
    }

    // ==================== 初始化与自动清除演示数据 ====================
    async function initApp() {
      let savedData = await dbGet('ootd_app_data');

      // 兼容尝试读取可能存在的旧版存储键
      if (!savedData) {
        for (const k of ['ootd_data_v2', 'ootd_data', 'closet_data']) {
          const legacy = await dbGet(k) || (localStorage.getItem(k) ? JSON.parse(localStorage.getItem(k)) : null);
          if (legacy && (legacy.items || legacy.outfits)) {
            savedData = legacy;
            break;
          }
        }
      }

      if (savedData) {
        state.categories = Array.isArray(savedData.categories) && savedData.categories.length
          ? savedData.categories
          : [...DEFAULT_CATEGORIES];

        // 过滤掉内置的 SVG 演示穿搭卡片和 LOOK 01~10 演示数据，保留用户真实上传的穿搭
        const rawOutfits = Array.isArray(savedData.outfits) ? savedData.outfits : [];
        state.outfits = rawOutfits.filter(o => {
          if (!o) return false;
          if (o.isDemo) return false;
          const img = String(o.image || o.photo || '');
          const note = String(o.note || o.title || '');
          if (img.startsWith('data:image/svg+xml')) return false;
          if (/^LOOK\s*0\d|^LOOK\s*10/i.test(note)) return false;
          return true;
        });

        // 收集用户真实穿搭中正在使用的单品 ID，确保不误删任何用户正在使用的单品
        const usedItemIds = new Set();
        state.outfits.forEach(o => {
          (o.itemIds || []).forEach(id => usedItemIds.add(id));
        });

        const rawItems = Array.isArray(savedData.items) ? savedData.items : [];
        state.items = rawItems.filter(item => {
          if (!item) return false;
          if (usedItemIds.has(item.id)) return true;
          if (item.isDemo) return false;
          if (DEMO_ITEM_NAMES.has(item.name)) return false;
          return true;
        });

        await saveData();
      } else {
        state.categories = [...DEFAULT_CATEGORIES];
        state.items = [];
        state.outfits = [];
        await saveData();
      }

      renderAll();
    }

    async function saveData() {
      await dbSet('ootd_app_data', {
        categories: state.categories,
        items: state.items,
        outfits: state.outfits
      });

    function renderMatchItems() {

        const catObj = state.categories.find(c => c.id === item.categoryId);

        const matchCat = state.selectedCategory === 'all' || item.categoryId === state.selectedCategory;

          </button>

    function toggleSelectItem(itemId) {
      const idx = state.selectedItemIds.indexOf(itemId);
      if (idx > -1) {
        state.selectedItemIds.splice(idx, 1);
      } else {
        state.selectedItemIds.push(itemId);
      }

    // 3. 渲染匹配穿搭结果（单品多选自动取交集）
    function renderOutfitsGrid() {
      const grid = document.getElementById('outfits-grid');
      const countBadge = document.getElementById('result-count-badge');
      const hint = document.getElementById('result-filter-hint');

      const matched = state.outfits.filter(outfit => {
        // 温度匹配
        const temps = Array.isArray(outfit.temps) ? outfit.temps : (outfit.temp ? [outfit.temp] : []);
        const tempOk = state.selectedTemp === 'all' || temps.includes(state.selectedTemp);

        // 单品交集匹配（所选的每一件单品都必须包含在该穿搭中）
        const outfitItems = Array.isArray(outfit.itemIds) ? outfit.itemIds : [];
        const itemsOk = state.selectedItemIds.every(selId => outfitItems.includes(selId));

        return tempOk && itemsOk;
      });

      countBadge.textContent = `${matched.length} 套`;

      if (state.selectedItemIds.length === 0 && state.selectedTemp === 'all') {
        hint.textContent = '当前展示全部穿搭';
      } else {
        const parts = [];
        if (state.selectedTemp !== 'all') parts.push(state.selectedTemp);
        if (state.selectedItemIds.length > 0) parts.push(`已选 ${state.selectedItemIds.length} 件单品`);
        hint.textContent = parts.join(' · ');
      }

      if (matched.length === 0) {
        grid.className = 'block';
        grid.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-100 shadow-xs">
            <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center mx-auto mb-3">

            <button

          </div>
        `;
        return;

      grid.className = 'grid grid-cols-2 gap-3';
      grid.innerHTML = matched.map(outfit => {
        const temps = Array.isArray(outfit.temps) ? outfit.temps : (outfit.temp ? [outfit.temp] : []);
        const itemNames = (outfit.itemIds || [])
          .map(id => state.items.find(i => i.id === id))
          .filter(Boolean);

        return `
          <div
            onclick="openOutfitModal('${outfit.id}')"

                  <span class="px-2 py-0.5 rounded-md bg-slate-900/70 text-white text-[10px] font-medium backdrop-blur-xs">
                    ${escapeHtml(t)}
                  </span>
                `).join('')}

            </div>
            <div class="p-2.5 flex-1 flex flex-col justify-between">
              ${outfit.note ? `<div class="text-xs font-bold text-slate-800 truncate mb-1.5">${escapeHtml(outfit.note)}</div>` : ''}
              <div class="flex flex-wrap gap-1">
                ${itemNames.map(item => {

                  return `
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${
                      isHighlighted

                      ${escapeHtml(item.name)}
                    </span>

    // ==================== 上传 / 编辑穿搭弹窗 ====================

      const delBtn = document.getElementById('delete-outfit-btn');
      const previewImg = document.getElementById('outfit-preview-img');

      const reuploadBtn = document.getElementById('outfit-reupload-btn');
      const noteInput = document.getElementById('outfit-note-input');
      document.getElementById('modal-item-search').value = '';
      document.getElementById('quick-add-item-box').classList.add('hidden');

      if (outfitId) {
        const outfit = state.outfits.find(o => o.id === outfitId);
        if (!outfit) return;
        titleEl.textContent = '编辑 / 查看穿搭';
        delBtn.classList.remove('hidden');
        modalImageBase64 = outfit.image;
        modalTempSelection = Array.isArray(outfit.temps) ? [...outfit.temps] : (outfit.temp ? [outfit.temp] : ['15-20°C (微凉)']);
        modalItemSelection = Array.isArray(outfit.itemIds) ? [...outfit.itemIds] : [];
        noteInput.value = outfit.note || '';

        previewImg.src = modalImageBase64;
        previewImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
        reuploadBtn.classList.remove('hidden');
      } else {
        titleEl.textContent = '上传新穿搭';
        delBtn.classList.add('hidden');
        modalImageBase64 = '';

        previewImg.classList.add('hidden');
        placeholder.classList.remove('hidden');
        reuploadBtn.classList.add('hidden');
      }

      renderModalTempOptions();
      renderModalItemSelector();
      modal.classList.remove('hidden');

      const htmlParts = [];

        if (catItems.length === 0) return;
        htmlParts.push(`
          <div>

            <div class="flex flex-wrap gap-1.5">
              ${catItems.map(item => {

                return `
                  <button
                    type="button"
                    onclick="toggleModalItem('${item.id}')"
                    class="px-2.5 py-1.5 rounded-lg text-xs font-medium border transition ${
                      checked
                        ? 'bg-indigo-600 text-white border-indigo-600'
                        : 'bg-slate-50 text-slate-700 border-slate-200'
                    }"
                  >
                    ${escapeHtml(item.name)}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `);
      });

      container.innerHTML = htmlParts.length ? htmlParts.join('') : `<div class="text-xs text-slate-400 py-2 text-center">无匹配单品</div>`;
    }

    function toggleModalItem(itemId) {
      const idx = modalItemSelection.indexOf(itemId);
      if (idx > -1) {
        modalItemSelection.splice(idx, 1);
      } else {
        modalItemSelection.push(itemId);
      }
      renderModalItemSelector();
    }

    function toggleQuickAddItem() {
      const box = document.getElementById('quick-add-item-box');
      const select = document.getElementById('quick-item-cat');
      select.innerHTML = state.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        document.getElementById('quick-item-name').focus();
      }
    }

    async function saveQuickAddItem() {
      const catId = document.getElementById('quick-item-cat').value;
      const nameInput = document.getElementById('quick-item-name');
      const name = nameInput.value.trim();
      if (!name) return showToast('请输入单品名称');

      const newItem = {
        id: 'item_' + Date.now(),
        name,
        categoryId: catId
      };
      state.items.unshift(newItem);
      modalItemSelection.push(newItem.id);
      nameInput.value = '';
      document.getElementById('quick-add-item-box').classList.add('hidden');
      await saveData();
      renderModalItemSelector();
      renderAll();
      showToast('已添加并勾选：' + name);
    }

    // 图片压缩处理（保证百张穿搭顺畅存储）
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1080;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          modalImageBase64 = canvas.toDataURL('image/jpeg', 0.82);

          const previewImg = document.getElementById('outfit-preview-img');
          previewImg.src = modalImageBase64;
          previewImg.classList.remove('hidden');
          document.getElementById('outfit-upload-placeholder').classList.add('hidden');
          document.getElementById('outfit-reupload-btn').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleSaveOutfit() {
      if (!modalImageBase64) return showToast('请先上传一张穿搭照片');
      if (modalItemSelection.length === 0) return showToast('请至少勾选一件关联的衣服单品');

      const note = document.getElementById('outfit-note-input').value.trim();

      if (editingOutfitId) {
        const idx = state.outfits.findIndex(o => o.id === editingOutfitId);
        if (idx > -1) {
          state.outfits[idx] = {
            ...state.outfits[idx],
            image: modalImageBase64,
            temps: [...modalTempSelection],
            itemIds: [...modalItemSelection],
            note
          };
        }
        showToast('穿搭已更新');
      } else {
        state.outfits.unshift({
          id: 'outfit_' + Date.now(),
          image: modalImageBase64,
          temps: [...modalTempSelection],
          itemIds: [...modalItemSelection],
          note,
          createdAt: Date.now()
        });
        showToast('新穿搭已保存');
      }

      await saveData();
      closeOutfitModal();
      renderAll();
    }

    async function handleDeleteOutfit() {
      if (!editingOutfitId) return;
      if (!confirm('确定要删除这套穿搭吗？')) return;
      state.outfits = state.outfits.filter(o => o.id !== editingOutfitId);
      await saveData();
      closeOutfitModal();
      renderAll();
      showToast('已删除穿搭');
    }

    // ==================== 自定义分类管理 ====================
    function openCategoryModal() {
      renderCategoryManageList();
      document.getElementById('category-modal').classList.remove('hidden');
    }

    function closeCategoryModal() {
      document.getElementById('category-modal').classList.add('hidden');
    }

    function renderCategoryManageList() {
      const container = document.getElementById('category-manage-list');
      container.innerHTML = state.categories.map((cat, idx) => {
        const count = state.items.filter(i => i.categoryId === cat.id).length;
        return `
          <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/70 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-800">${escapeHtml(cat.name)}</span>
              <span class="text-[11px] text-slate-400">(${count}件)</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="moveCategory(${idx}, -1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-500 text-xs">
                <i class="fa-solid fa-arrow-up text-[10px]"></i>
              </button>
              <button onclick="moveCategory(${idx}, 1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-500 text-xs">
                <i class="fa-solid fa-arrow-down text-[10px]"></i>
              </button>
              <button onclick="renameCategory('${cat.id}')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-600 text-xs">
                <i class="fa-solid fa-pen text-[10px]"></i>
              </button>
              <button onclick="deleteCategory('${cat.id}')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-rose-500 text-xs">
                <i class="fa-solid fa-trash text-[10px]"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleAddCategory() {
      const input = document.getElementById('new-category-input');
      const name = input.value.trim();
      if (!name) return showToast('请输入分类名称');
      if (state.categories.some(c => c.name === name)) return showToast('该分类已存在');

      state.categories.push({ id: 'cat_' + Date.now(), name });
      input.value = '';
      await saveData();
      renderCategoryManageList();
      renderAll();
      showToast('已添加分类：' + name);
    }

    async function moveCategory(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= state.categories.length) return;
      const temp = state.categories[idx];
      state.categories[idx] = state.categories[target];
      state.categories[target] = temp;
      await saveData();
      renderCategoryManageList();
      renderAll();
    }

    async function renameCategory(catId) {
      const cat = state.categories.find(c => c.id === catId);
      if (!cat) return;
      const newName = prompt('修改分类名称：', cat.name);
      if (!newName || !newName.trim()) return;
      cat.name = newName.trim();
      await saveData();
      renderCategoryManageList();
      renderAll();
    }

    async function deleteCategory(catId) {
      if (state.categories.length <= 1) return showToast('至少保留一个分类');
      const count = state.items.filter(i => i.categoryId === catId).length;
      if (count > 0 && !confirm(`该分类下有 ${count} 件单品，删除分类后这些单品将移入第一个分类，确定继续吗？`)) return;

      const remainCats = state.categories.filter(c => c.id !== catId);
      const fallbackCatId = remainCats[0].id;
      state.items.forEach(i => {
        if (i.categoryId === catId) i.categoryId = fallbackCatId;
      });
      state.categories = remainCats;
      if (state.selectedCategory === catId) state.selectedCategory = 'all';
      if (state.closetCategory === catId) state.closetCategory = 'all';

      await saveData();
      renderCategoryManageList();
      renderAll();
    }

    // ==================== 新建 / 编辑单品弹窗 ====================
    function openItemModal(itemId = null) {
      editingItemId = itemId;
      const modal = document.getElementById('item-modal');
      const title = document.getElementById('item-modal-title');
      const select = document.getElementById('item-modal-cat');
      const nameInput = document.getElementById('item-modal-name');

      select.innerHTML = state.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

      if (itemId) {
        const item = state.items.find(i => i.id === itemId);
        if (!item) return;
        title.textContent = '修改单品';
        select.value = item.categoryId;
        nameInput.value = item.name;
      } else {
        title.textContent = '新建衣服单品';
        select.value = state.closetCategory !== 'all' ? state.closetCategory : state.categories[0].id;
        nameInput.value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    async function handleSaveItemModal() {
      const catId = document.getElementById('item-modal-cat').value;
      const name = document.getElementById('item-modal-name').value.trim();
      if (!name) return showToast('请输入单品名称');

      if (editingItemId) {
        const item = state.items.find(i => i.id === editingItemId);
        if (item) {
          item.categoryId = catId;
          item.name = name;
        }
        showToast('单品已更新');
      } else {
        state.items.unshift({
          id: 'item_' + Date.now(),
          name,
          categoryId: catId
        });
        showToast('已添加单品：' + name);
      }

      await saveData();
      closeItemModal();
      renderAll();
    }

    async function handleDeleteItem(itemId) {
      const item = state.items.find(i => i.id === itemId);
      if (!item) return;
      if (!confirm(`确定要删除单品「${item.name}」吗？`)) return;

      state.items = state.items.filter(i => i.id !== itemId);
      state.selectedItemIds = state.selectedItemIds.filter(id => id !== itemId);
      state.outfits.forEach(o => {
        o.itemIds = (o.itemIds || []).filter(id => id !== itemId);
      });

      await saveData();
      renderAll();
      showToast('已删除单品');
    }

    // ==================== 备份与恢复 ====================
    function openBackupModal() {
      document.getElementById('backup-modal').classList.remove('hidden');
    }

    function closeBackupModal() {
      document.getElementById('backup-modal').classList.add('hidden');
    }

    function exportBackupData() {
      const dataStr = JSON.stringify({
        categories: state.categories,
        items: state.items,
        outfits: state.outfits,
        exportedAt: new Date().toISOString()
      });
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ootd223_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已导出备份文件');
    }

    function importBackupData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.categories || !parsed.items || !parsed.outfits) {
            return showToast('备份文件格式不正确');
          }
          state.categories = parsed.categories;
          state.items = parsed.items;
          state.outfits = parsed.outfits;
          await saveData();
          closeBackupModal();
          renderAll();
          showToast('数据已成功恢复');
        } catch {
          showToast('备份文件解析失败');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
